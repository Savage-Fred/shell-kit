# References live left; -d preserves typing focus. No prefix required.
bind-key -n F1 run-shell -b '"$HOME/.local/share/shell-kit/bin/cheat" tmux "#{pane_id}"'
bind-key -n F2 run-shell -b '"$HOME/.local/share/shell-kit/bin/cheat" vim "#{pane_id}"'
bind-key -n F3 run-shell -b '"$HOME/.local/share/shell-kit/bin/cheat" grep "#{pane_id}"'
bind-key -n F4 run-shell -b '"$HOME/.local/share/shell-kit/bin/cheat" aliases "#{pane_id}"'
set-hook -g 'client-attached[730]' 'run-shell -b "\"$HOME/.local/share/shell-kit/bin/cheat\" attach #{pane_id} #{q:client_tty}"'
set-hook -g 'pane-exited[730]' 'run-shell -b "\"$HOME/.local/share/shell-kit/bin/cheat\" cleanup #{window_id}"'
set-hook -g 'after-new-session[730]' 'run-shell -b "\"$HOME/.local/share/shell-kit/bin/cheat\" attach #{pane_id} #{q:client_tty}"'
set-hook -g 'client-session-changed[730]' 'run-shell -b "\"$HOME/.local/share/shell-kit/bin/cheat\" attach #{pane_id} #{q:client_tty}"'
